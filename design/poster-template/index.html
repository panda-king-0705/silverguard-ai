<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SilverGuard Poster Template</title>
<link rel="icon" href="data:,">
<style>
/* Blank A3 template based on the poster v1 layout. */
:root {
  /* Colour tokens. Every text/background pair is measured in the browser check (>= 4.5:1). */
  --ink: #14232B;
  --muted: #3F4C55;
  --teal: #0E4F54;       /* protection, headings (same teal as the clickable screens) */
  --teal-2: #E3F0EF;
  --sand: #F3EFE6;
  --indigo: #2F3B73;     /* Scam Check */
  --indigo-2: #E8EBF6;
  --risk: #8E1B13;       /* red is used only for risk, always with words and an icon */
  --risk-2: #FBE9E7;
  --amber-ink: #5E4200;
  --amber-2: #FFF3CF;
  --amber: #F2C14E;
  --slate: #2E3A46;
  --slate-2: #E9ECEF;
  --blue-2: #E3EEFB;
  --line: #6B7780;
  --white: #FFFFFF;
  --focus: #0B4FD6;
  --b: 13pt;             /* body size; the script raises it to the largest size (max 20 pt) that fits */
  --pad: 6mm;
  --gap: 3.5mm;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: #E8E6E1; color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
.draft-note { display: inline-block; margin: 0 0 8px; padding: 4px 10px; font-size: 16px; border: 2px dashed var(--muted); border-radius: 8px; color: var(--muted); background: #FFFFFF; }
.status { margin: 0 0 10px; font-size: 16px; color: var(--muted); }
.status b { color: var(--ink); }
.scaler { position: relative; margin: 0 auto; }

/* ---------- the poster: true A3 in mm, scaled on screen ---------- */
.poster {
  position: absolute; top: 0; left: 0; transform-origin: top left;
  width: 297mm; height: 420mm; overflow: hidden; background: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  padding: var(--pad); display: grid; gap: var(--gap);
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(7, auto);               /* rows share the leftover height equally */
  grid-template-areas:
    "z1 z1 z1 z1 z1 z1"
    "z2 z2 z2 z2 z3 z3"
    "z4 z4 z4 z4 z5 z5"
    "z6 z6 z6 z6 z6 z6"
    "z7 z7 z7 z8 z8 z8"
    "z9 z9 z9 z10 z10 z10"
    "z11 z11 z11 z11 z11 z11";
  font-size: var(--b); line-height: 1.25; counter-reset: zone;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.zone {
  counter-increment: zone; position: relative; min-width: 0; overflow: hidden;
  background: var(--zbg, #FFFFFF); color: var(--ink); border: .4mm solid var(--zline, var(--line)); border-radius: 2.5mm;
  padding: 2.5mm 3mm; display: flex; flex-direction: column; gap: 1.6mm;
}
.zone > * { margin: 0; }
.z1 { grid-area: z1; } .z2 { grid-area: z2; } .z3 { grid-area: z3; } .z4 { grid-area: z4; } .z5 { grid-area: z5; } .z6 { grid-area: z6; }
.z7 { grid-area: z7; } .z8 { grid-area: z8; } .z9 { grid-area: z9; } .z10 { grid-area: z10; } .z11 { grid-area: z11; }

/* reading-order badge, generated by CSS (decorative, not counted as words) */
.zn { flex: none; display: inline-grid; place-items: center; width: 8mm; height: 8mm; border-radius: 50%; background: var(--ink); color: #FFFFFF; font-size: 12pt; font-weight: 800; line-height: 1; }
.zn::before { content: counter(zone); }
.zone h2 { font-size: 24pt; line-height: 1.1; font-weight: 800; color: var(--teal); display: flex; align-items: center; gap: 2.5mm; }
cite { font-style: normal; font-weight: 700; color: var(--muted); font-size: .8em; white-space: nowrap; }

/* 1 title */
.z1 { --zbg: var(--teal); --zline: var(--teal); color: #FFFFFF; gap: 2mm; justify-content: center; }
.z1top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4mm; }
.z1 h1 { margin: 0; font-size: 52pt; line-height: 1.04; font-weight: 800; letter-spacing: -.01em; max-width: 215mm; }
.brand { margin: 0; text-align: right; font-size: 24pt; line-height: 1.05; font-weight: 800; color: var(--amber); }
.hook { font-size: 28pt; line-height: 1.15; font-weight: 600; color: #FFFFFF; }
.z1 .zn { position: absolute; top: 3mm; right: 3mm; display: none; }

/* 2 problem */
.z2, .z3 { --zbg: var(--sand); }
.stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr) minmax(0, 1.3fr); gap: 3mm; }
.stat p { margin: 0; }
.stat .num { font-size: 40pt; line-height: 1; font-weight: 800; color: var(--teal); }
.statement { font-weight: 500; }
.statement b { font-weight: 800; }

/* 3 blind spots */
.blind { list-style: none; margin: 0; padding: 0; display: grid; gap: 2mm; }
.blind li { padding-left: 4.5mm; position: relative; }
.blind li::before { content: ""; position: absolute; left: 0; top: .5em; width: 2.4mm; height: 2.4mm; border-radius: 50%; background: var(--teal); }

/* 4 layers */
.z4 { --zbg: var(--teal-2); --zline: var(--teal); }
.layers { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3mm; counter-reset: layer; }
.layers li { counter-increment: layer; background: #FFFFFF; border: .3mm solid var(--teal); border-radius: 2mm; padding: 2mm 2.5mm; }
.layers h3 { margin: 0 0 1mm; font-size: 20pt; line-height: 1.08; font-weight: 800; color: var(--teal); }
.layers h3::before { content: counter(layer); display: inline-grid; place-items: center; width: 7mm; height: 7mm; margin-right: 1.5mm; border-radius: 50%; background: var(--teal); color: #FFFFFF; font-size: 12pt; vertical-align: .1em; }
.layers p { margin: 0; }
.later { font-style: italic; }

/* images cropped from the original PNGs with CSS (no re-export) */
.crop { flex: none; position: relative; margin: 0; overflow: hidden; background: #FFFFFF; border: .3mm solid var(--line); border-radius: 1.5mm; }
.crop img { display: block; position: relative; max-width: none; height: auto; }
.crop.flow { aspect-ratio: 1044 / 140; }
.crop.flow img { width: 128.736%; margin-left: -16.284%; margin-top: -60.728%; }
.crop.band { aspect-ratio: 1272 / 100; }
.crop.band img { width: 105.660%; margin-left: -2.830%; margin-top: -39.544%; }

/* 5 how it decides */
.z5 { --zbg: var(--indigo-2); --zline: var(--indigo); }
.z5 h2 { color: var(--indigo); }
.levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.6mm; }
.levels li { display: flex; align-items: center; gap: 2mm; padding: 1mm 2.5mm; border-radius: 2mm; border: .4mm solid; font-weight: 700; line-height: 1.15; }
.levels .hi { background: var(--risk-2); color: var(--risk); border-color: var(--risk); }
.levels .mid { background: var(--amber-2); color: var(--amber-ink); border-color: var(--amber-ink); }
.levels .low { background: var(--slate-2); color: var(--slate); border-color: var(--slate); }
.i { flex: none; width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.never { font-weight: 800; color: var(--indigo); }

/* 6 privacy */
.z6 { --zbg: var(--blue-2); --zline: #1F5FA8; gap: 2mm; }
.privacy { font-size: 26pt; line-height: 1.1; font-weight: 800; color: var(--ink); padding-left: 11mm; position: relative; }
.privacy .zn { position: absolute; left: 0; top: 1mm; }
.z6 .crop { border-color: #1F5FA8; }

/* 7 business */
.bc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1mm; }
.bc b { color: var(--teal); }
.bc .seed { font-size: 1.1em; }
.bc .seed strong { font-size: 1.9em; font-weight: 800; color: var(--teal); }

/* 8 evolved */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2mm; }
.steps li { position: relative; padding: .6mm 2mm .6mm 2.5mm; border-left: 1.4mm solid var(--teal); background: var(--sand); border-radius: 0 2mm 2mm 0; }
.steps li + li::before { content: ""; position: absolute; left: 3mm; top: -2.2mm; border: 1.5mm solid transparent; border-top: 2mm solid var(--teal); border-bottom: 0; }
.steps b { color: var(--teal); }

/* 9 validation */
.z9 { --zbg: var(--amber-2); --zline: var(--amber-ink); }
.z9 h2 { color: var(--amber-ink); }
.lbl { font-weight: 700; }
.quotes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2mm; }
.ph { border: .5mm dashed var(--amber-ink); border-radius: 1.5mm; background: #FFFFFF; color: var(--amber-ink); font-weight: 700; text-align: center; padding: 1.2mm 1mm; }
.ph-inline { border: .4mm dashed var(--amber-ink); background: var(--amber-2); color: var(--amber-ink); font-weight: 700; padding: 0 1mm; border-radius: 1mm; }
.acc { padding: 1.2mm 2mm; background: #FFFFFF; border-left: 1.4mm solid var(--indigo); border-radius: 0 2mm 2mm 0; }
.acc b { color: var(--indigo); }

/* 10 risks */
.z10 { --zbg: var(--risk-2); --zline: var(--risk); }
.z10 h2 { color: var(--risk); }
.risks { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.6mm; }
.risks li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 2mm; }
.risks .r { font-weight: 800; color: var(--risk); display: inline-flex; align-items: center; gap: 1.5mm; }
.risks .f::before { content: "\2192"; margin-right: 2mm; color: var(--ink); font-weight: 700; }

/* 11 sources */
.z11 { --zbg: #ECEFF1; min-height: 30mm; padding-right: 31mm; font-size: 12pt; line-height: 1.3; justify-content: center; }
.z11 .zn { width: 6mm; height: 6mm; font-size: 9pt; }
.z11 .srcs { display: block; }
.z11 b { font-weight: 800; }
.z11 .head { display: inline-flex; align-items: center; gap: 2mm; font-weight: 800; font-size: 13pt; color: var(--teal); margin-right: 2mm; }
.z11 .ref { margin-right: 2mm; white-space: nowrap; }
.z11 cite { font-size: 1em; }
.qr { position: absolute; right: 3mm; top: 2.5mm; width: 24mm; height: 24mm; border: .5mm dashed var(--amber-ink); background: var(--amber-2); color: var(--amber-ink); font-size: 8.5pt; font-weight: 700; line-height: 1.15; display: grid; place-items: center; text-align: center; padding: 1mm; }

@page { size: A3 portrait; margin: 0; }
@media print {
  body { background: #FFFFFF; }
  .wrap > :not(.scaler) { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .scaler { width: auto !important; height: auto !important; }
  .poster { position: static; transform: none !important; box-shadow: none; break-inside: avoid; }
}

.box { flex: 1; min-height: 12mm; border: .5mm dashed var(--line); border-radius: 2mm; background: rgba(255,255,255,.6); display: grid; place-items: center; color: var(--muted); font-size: 11pt; font-weight: 600; text-align: center; padding: 2mm; }
.z1 .box { border-color: rgba(255,255,255,.7); color: #FFFFFF; background: transparent; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3mm; flex: 1; }
.poster { grid-template-rows: 1.1fr 1fr 1.3fr .8fr 1fr 1fr .55fr; }
</style>
</head>
<body>
<div class="wrap">
<div class="scaler" id="scaler" style="width:297mm;height:420mm">
<article class="poster" id="poster" aria-label="Blank A3 poster template" style="position:static">
<section class="zone z1 "><div class="box">Headline</div><div class="box">Project name / tagline</div></section>
<section class="zone z2 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="row3"><div class="box">Stat</div><div class="box">Stat</div><div class="box">Stat</div></div><div class="box">Text</div></section>
<section class="zone z3 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Text</div></section>
<section class="zone z4 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="row3"><div class="box">Box</div><div class="box">Box</div><div class="box">Box</div></div><div class="box">Diagram</div></section>
<section class="zone z5 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Text</div></section>
<section class="zone z6 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Statement</div><div class="box">Diagram</div></section>
<section class="zone z7 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Text</div></section>
<section class="zone z8 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Text</div></section>
<section class="zone z9 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="row3"><div class="box">Quote</div><div class="box">Quote</div><div class="box">Quote</div></div><div class="box">Text</div></section>
<section class="zone z10 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Text</div></section>
<section class="zone z11 "><h2><span class="zn" aria-hidden="true"></span>Heading</h2><div class="box">Sources / notes</div><div class="qr">QR code</div></section>
</article>
</div>
</div>
</body>
</html>
